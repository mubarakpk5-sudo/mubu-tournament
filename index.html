<!DOCTYPE html>
<html lang="ml"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>താനൂർ LIVE Scoreboard</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;text-align:center;margin:0;padding:12px}
.live{background:#dc2626;padding:6px 16px;border-radius:20px;font-weight:700;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.card{background:#fff;color:#111;border-radius:22px;padding:22px;max-width:520px;margin:14px auto}
.score{font-size:80px;font-weight:900;line-height:1}.team{font-size:22px;font-weight:800}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc;font-size:15px}
button{width:100%;padding:14px;background:#16a34a;color:#fff;border:0;border-radius:12px;font-size:17px;font-weight:700}
.grey{background:#334155}
</style></head><body>
<h2>🏸 താനൂർ ബ്ലോക്ക് കേരളോത്സവം</h2>
<p>ബാഡ്മിന്റൺ ടൂർണമെന്റ് - MUBU TOURNAMENT</p>
<span class="live" id="status">● LIVE</span>
<div class="card">
<p id="title" style="font-weight:800;font-size:19px;margin:0">Final - Men's Singles</p>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px">
<div><div class="team" id="t1">Team A</div><div class="score" id="s1">0</div><div id="set1">Sets: 0</div></div>
<div style="font-size:22px;color:#888">VS</div>
<div><div class="team" id="t2">Team B</div><div class="score" id="s2">0</div><div id="set2">Sets: 0</div></div>
</div>
<p id="com" style="color:#16a34a;font-weight:700;margin-top:16px">Match Starting...</p>
<p style="font-size:12px;color:#888">🟢 LIVE - സ്കോർ തനിയെ മാറും, Refresh വേണ്ട</p>
</div>
<button class="grey" onclick="document.getElementById('admin').style.display='block'">🔐 Admin Only</button>
<div id="admin" style="display:none;max-width:520px;margin:12px auto;background:#fff;color:#000;padding:18px;border-radius:20px;text-align:left">
<input id="pass" type="password" placeholder="Password: tanur123">
<input id="a_t1" placeholder="Team 1 പേര്">
<input id="a_t2" placeholder="Team 2 പേര്">
<input id="a_s1" type="number" placeholder="Team 1 Score">
<input id="a_s2" type="number" placeholder="Team 2 Score">
<input id="a_set1" type="number" placeholder="Team 1 Sets">
<input id="a_set2" type="number" placeholder="Team 2 Sets">
<input id="a_com" placeholder="Commentary">
<select id="a_status"><option>LIVE</option><option>BREAK</option><option>FINISHED</option></select>
<button onclick="saveData()">✅ LIVE Update</button>
<div style="display:flex;gap:8px;margin-top:10px"><button type="button" style="background:#2563eb" onclick="quick(1)">+1 Team 1</button><button type="button" style="background:#db2777" onclick="quick(2)">+1 Team 2</button></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase, ref, onValue, set} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const app = initializeApp({databaseURL:"https://tanur-keralosav-default-rtdb.firebaseio.com"});
const db = getDatabase(app);
const liveRef = ref(db,"live");
let cur={};
onValue(liveRef,(snap)=>{let d=snap.val(); if(!d) return; cur=d;
document.getElementById('title').innerText=d.title||"Final";
document.getElementById('t1').innerText=d.t1||"Team A"; document.getElementById('t2').innerText=d.t2||"Team B";
document.getElementById('s1').innerText=d.s1??0; document.getElementById('s2').innerText=d.s2??0;
document.getElementById('set1').innerText="Sets: "+(d.set1??0); document.getElementById('set2').innerText="Sets: "+(d.set2??0);
document.getElementById('com').innerText=d.com||""; document.getElementById('status').innerText="● "+(d.status||"LIVE");
});
window.saveData=async()=>{
if(document.getElementById('pass').value!=="tanur123"){alert("Admin മാത്രം");return;}
let data={title:cur.title||"Final",t1:document.getElementById('a_t1').value||cur.t1||"Team A",t2:document.getElementById('a_t2').value||cur.t2||"Team B",s1:document.getElementById('a_s1').value||cur.s1||0,s2:document.getElementById('a_s2').value||cur.s2||0,set1:document.getElementById('a_set1').value||cur.set1||0,set2:document.getElementById('a_set2').value||cur.set2||0,com:document.getElementById('a_com').value||cur.com||"",status:document.getElementById('a_status').value};
await set(liveRef,data); alert("LIVE Updated!");
};
window.quick=async(n)=>{
if(document.getElementById('pass').value!=="tanur123"){alert("ആദ്യം Password അടിക്കൂ");return;}
if(n==1) cur.s1=Number(cur.s1||0)+1; else cur.s2=Number(cur.s2||0)+1;
await set(liveRef,cur);
};
</script></body></html>
